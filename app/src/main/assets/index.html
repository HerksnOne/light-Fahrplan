<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zug</title>
<style>
  :root {
    --bg: #000; --fg: #fff; --dim: #8a8a8a; --line: #2a2a2a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
    font-size: 18px; line-height: 1.35;
    max-width: 520px; margin: 0 auto; padding: 18px 20px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  nav { display: flex; gap: 22px; margin-bottom: 28px; }
  nav button { font-size: 18px; color: var(--dim); padding: 6px 0; }
  nav button[aria-current="true"] { color: var(--fg); border-bottom: 2px solid var(--fg); }

  .view { display: none; }
  .view.on { display: block; }

  /* Suche */
  .field { position: relative; border-bottom: 1px solid var(--line); }
  .field label { display: block; font-size: 14px; color: var(--dim); padding-top: 10px; }
  .field input {
    width: 100%; background: none; border: 0; padding: 4px 0 12px;
    font-size: 26px; font-weight: 500; outline: none;
  }
  .field input::placeholder { color: #444; }
  .swap { position: absolute; right: 0; top: 18px; font-size: 26px; padding: 4px 8px; color: var(--dim); }
  .sugg { list-style: none; margin: 0 0 8px; padding: 0; }
  .sugg li button { width: 100%; padding: 12px 0; font-size: 18px; border-bottom: 1px solid var(--line); }

  .when { display: flex; align-items: center; gap: 18px; padding: 18px 0; flex-wrap: wrap; }
  .when button { color: var(--dim); padding: 4px 0; }
  .when button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 5px; }
  .when input {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; color-scheme: dark; font-size: 16px;
  }

  .go {
    display: block; width: 100%; text-align: center;
    background: var(--fg); color: var(--bg); border-radius: 30px;
    padding: 16px; font-size: 20px; font-weight: 600; margin: 6px 0 34px;
  }
  .go:disabled { opacity: .35; }

  h2 { font-size: 15px; font-weight: 400; color: var(--dim); margin: 0 0 6px; }
  .routes button { display: block; width: 100%; padding: 12px 0; font-size: 20px; border-bottom: 1px solid var(--line); }

  /* Ergebnisse */
  .head { font-size: 16px; color: var(--dim); margin-bottom: 8px; }
  .head strong { color: var(--fg); font-weight: 500; }
  .row { display: block; width: 100%; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .times { font-size: 32px; font-weight: 300; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .times .arr { color: var(--dim); }
  .meta { font-size: 15px; color: var(--dim); margin-top: 2px; }
  .late { font-size: 15px; margin-top: 4px; }
  s { color: var(--dim); }
  .cx { text-decoration: line-through; text-decoration-thickness: 2px; }
  .more { display: block; width: 100%; text-align: center; padding: 18px; color: var(--dim); }

  /* Detail */
  .leg { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .leg .line { font-size: 15px; color: var(--dim); margin: 6px 0; padding-left: 64px; }
  .stop { display: grid; grid-template-columns: 64px 1fr; align-items: baseline; }
  .stop .t { font-size: 22px; font-variant-numeric: tabular-nums; }
  .stop .n { font-size: 18px; }
  .stop .p { font-size: 14px; color: var(--dim); }
  .walk { padding: 12px 0 12px 64px; color: var(--dim); font-size: 15px; border-bottom: 1px solid var(--line); }
  .actions { display: flex; flex-direction: column; gap: 4px; margin-top: 22px; }
  .actions button { padding: 12px 0; font-size: 18px; }
  .actions .danger { color: var(--dim); }

  .back { color: var(--dim); padding: 4px 0; margin-bottom: 16px; font-size: 16px; }
  .msg { color: var(--dim); padding: 22px 0; font-size: 17px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 18px; border-radius: 20px; font-size: 16px; display: none;
  }

  /* Kompakt fürs Light Phone: Seite selbst scrollt nie, nur Listen darin */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; padding: 10px 18px 8px; overflow: hidden; }
  nav { flex-shrink: 0; margin-bottom: 10px; gap: 20px; }
  nav button { font-size: 17px; padding: 4px 0; }
  .view.on { flex: 1; min-height: 0; overflow-y: auto; }
  #v-suche.on { display: flex; flex-direction: column; }
  #v-suche > * { flex-shrink: 0; }
  #v-suche > #routes-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .field label { padding-top: 4px; font-size: 13px; }
  .field input { font-size: 22px; padding: 10px 0 10px; }
  .swap { top: 6px; font-size: 22px; }
  .when { padding: 10px 0 6px; gap: 14px; flex-wrap: nowrap; }
  .when input { flex: 1; min-width: 0; font-size: 14px; padding: 4px 6px; }
  .go {
    display: inline-block; width: auto; align-self: flex-start;
    background: none; color: var(--fg); border-radius: 0;
    padding: 6px 0; margin: 4px 0 12px;
    font-size: 20px; font-weight: 500;
    border-bottom: 2px solid var(--fg);
  }
  .go:disabled { opacity: 1; color: #4a4a4a; border-color: #4a4a4a; }
  .routes button { padding: 10px 0; font-size: 18px; }
  .sugg li button { padding: 9px 0; }
  .when.time { padding-top: 0; gap: 18px; }
  .pick {
    position: relative; display: inline-block; font-size: 18px; line-height: 1.3;
    padding: 2px 0; border-bottom: 1px solid var(--dim); font-variant-numeric: tabular-nums;
  }
  .pick select {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    opacity: 0; font-size: 16px; border: 0; cursor: pointer;
  }
  #sheet {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: 520px; margin: 0 auto;
  }
  #sheet[hidden] { display: none; }
  #sheet .back { align-self: flex-start; margin-bottom: 8px; }
  .opts { flex: 1; min-height: 0; overflow-y: auto; }
  .opts button {
    display: block; width: 100%; padding: 10px 0; font-size: 22px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .opts button[aria-selected="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 6px; }
  .opts.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; align-content: start; }
  .opts.grid button { text-align: center; }
  .tp-days { display: flex; gap: 18px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .tp-days::-webkit-scrollbar { display: none; }
  .tp-days button { width: auto; flex-shrink: 0; font-size: 19px; padding: 6px 0; }
  .tp-label { font-size: 13px; color: var(--dim); margin: 6px 0 2px; }
  .tp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0 4px; }
  .tp-grid button { text-align: center; font-size: 19px; padding: 5px 0; }
  #sheet-title:empty { display: none; }
  .tp-grid.off button { color: #333; }
  .tp-foot { margin-top: 10px; }
  .wheel { position: relative; display: flex; justify-content: center; align-items: center; gap: 10px; height: 200px; margin: 10px 0 4px; }
  .wcol {
    height: 200px; width: 72px; box-sizing: border-box; padding: 80px 0;
    overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; text-align: center;
    -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent);
    mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent);
  }
  .wcol::-webkit-scrollbar { display: none; }
  .wi { height: 40px; line-height: 40px; font-size: 24px; color: #6a6a6a; scroll-snap-align: center; font-variant-numeric: tabular-nums; cursor: pointer; }
  .wi.on { color: var(--fg); font-size: 30px; }
  .wsep { font-size: 28px; }
  .wband { position: absolute; left: 20%; right: 20%; top: 80px; height: 40px; border-top: 1px solid #333; border-bottom: 1px solid #333; pointer-events: none; }
  .opts #tp-ok { display: inline-block; width: auto; color: var(--fg); text-align: left; font-size: 20px; padding: 4px 0; }
  .tp-foot .go { margin: 0; }
  .tp-sum { font-size: 15px; color: var(--dim); }
</style>
</head>
<body>

<nav>
  <button data-nav="suche">Suche</button>
  <button data-nav="gespeichert">Gespeichert</button>
</nav>

<!-- Suche -->
<section class="view" id="v-suche">
  <div class="field">
    <input id="from" aria-label="Start" autocomplete="off" placeholder="Start">
  </div>
  <ul class="sugg" id="sugg-from"></ul>
  <div class="field">
    <input id="to" aria-label="Ziel" autocomplete="off" placeholder="Ziel">
    <button class="swap" id="swap" aria-label="Start und Ziel tauschen">⇅</button>
  </div>
  <ul class="sugg" id="sugg-to"></ul>

  <div class="when">
    <button id="m-dep" aria-pressed="true">Abfahrt</button>
    <button id="m-arr" aria-pressed="false">Ankunft</button>
    <button id="dt" aria-pressed="false">DE-Ticket</button>
  </div>
  <div class="when time">
    <button class="pick" id="when-l" aria-label="Zeit wählen">Jetzt</button>
    <select id="day" hidden></select><select id="hh" hidden></select><select id="mi" hidden></select>
  </div>

  <button class="go" id="search" disabled>Suchen</button>

  <div id="routes-wrap">
    <h2>Strecken</h2>
    <div class="routes" id="routes"></div>
  </div>
</section>

<!-- Ergebnisse -->
<section class="view" id="v-ergebnisse">
  <button class="back" data-nav="suche">‹ Suche</button>
  <div class="head" id="res-head"></div>
  <div id="res"></div>
</section>

<!-- Detail -->
<section class="view" id="v-detail">
  <button class="back" id="detail-back">‹ Zurück</button>
  <div id="detail"></div>
  <div class="actions" id="detail-actions"></div>
</section>

<!-- Gespeichert -->
<section class="view" id="v-gespeichert">
  <div id="saved"></div>
</section>

<div id="sheet" hidden>
  <button class="back" id="sheet-close">‹ Zurück</button>
  <h2 id="sheet-title"></h2>
  <div class="opts" id="sheet-opts"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- Konfiguration ----------
const DB = 'https://int.bahn.de/web/api'; // Fahrplan-Schnittstelle von bahn.de

// ---------- Zustand ----------
const S = {
  from: null, to: null,          // {id, name}
  mode: 'dep',                   // 'dep' | 'arr'
  journeys: [], laterRef: null,
  current: null,                 // Journey in der Detailansicht
  currentSavedId: null,          // gesetzt, wenn aus "Gespeichert" geöffnet
  detailFrom: 'ergebnisse'
};

// ---------- Speicher ----------
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { return false; }
}
let saved = load('zug2.saved', []);    // [{id, journey, savedAt}]
let routes = load('zug2.routes', []);  // [{from:{id,name}, to:{id,name}}]

// ---------- Helfer ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = iso => iso ? new Date(iso).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}) : '–';
const day = iso => new Date(iso).toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'numeric'});

function dur(a, b) {
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
}
function timeHtml(planned, actual, delay, cancelled) {
  if (cancelled) return `<span class="cx">${hm(planned)}</span>`;
  if (delay && delay >= 60 && actual) return `<s>${hm(planned)}</s> ${hm(actual)}`;
  return hm(actual || planned);
}
function toast(text) {
  const t = $('toast'); t.textContent = text; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 1800);
}
// ---------- Datenabruf ----------
// In der App laufen Anfragen über Kotlin (window.Native), im Browser per fetch.
const pending = {}; let reqN = 0;
window.__nativeResponse = (id, status, b64) => {
  const done = pending[id]; if (!done) return; delete pending[id];
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  done({status, text: new TextDecoder('utf-8').decode(bytes)});
};
async function http(method, url, body, headers) {
  headers = Object.assign({'Accept': 'application/json', 'Content-Type': 'application/json'}, headers || {});
  let r;
  if (window.Native) {
    r = await new Promise(res => {
      const id = String(++reqN); pending[id] = res;
      window.Native.request(id, method, url, JSON.stringify(headers), body ? JSON.stringify(body) : '');
    });
  } else {
    const f = await fetch(url, {method, headers, body: body ? JSON.stringify(body) : undefined});
    r = {status: f.status, text: await f.text()};
  }
  if (r.status < 200 || r.status >= 300) throw new Error('HTTP ' + r.status + ' ' + r.text.slice(0, 160));
  return JSON.parse(r.text);
}
function localTime(d) {
  const z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}:00`;
}
function withOffset(d) {
  const z = n => String(n).padStart(2, '0'), off = -d.getTimezoneOffset(), a = Math.abs(off);
  return localTime(d) + (off >= 0 ? '+' : '-') + z(Math.floor(a / 60)) + ':' + z(a % 60);
}
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}

// Bahnhofssuche: bahn.de  /  Verbindungen: Schnittstelle der DB-Navigator-App
const NAV = 'https://app.services-bahn.de/mob';
const NAV_TYPE = 'application/x.db.vendo.mob.verbindungssuche.v9+json';
const navHeaders = () => ({'Accept': NAV_TYPE, 'Content-Type': NAV_TYPE, 'X-Correlation-ID': uuid() + '_' + uuid()});
const NAV_ALL = ['HOCHGESCHWINDIGKEITSZUEGE', 'INTERCITYUNDEUROCITYZUEGE', 'INTERREGIOUNDSCHNELLZUEGE', 'NAHVERKEHRSONSTIGEZUEGE',
  'SBAHNEN', 'BUSSE', 'SCHIFFE', 'UBAHN', 'STRASSENBAHN', 'ANRUFPFLICHTIGEVERKEHRE'];
const NAV_DT = NAV_ALL.filter(x => x !== 'HOCHGESCHWINDIGKEITSZUEGE' && x !== 'INTERCITYUNDEUROCITYZUEGE');

async function dbLocations(q) {
  const r = await http('GET', `${DB}/reiseloesung/orte?suchbegriff=${encodeURIComponent(q)}&typ=ALL&limit=10`);
  return (Array.isArray(r) ? r : []).filter(x => x.id && (!x.type || x.type === 'ST')).slice(0, 6)
    .map(x => ({id: x.id, name: x.name}));
}
function navBase(dt) {
  return {
    autonomeReservierung: false, einstiegsTypList: ['STANDARD'],
    fahrverguenstigungen: {deutschlandTicketVorhanden: !!dt, nurDeutschlandTicketVerbindungen: !!dt},
    klasse: 'KLASSE_2',
    reisendenProfil: {reisende: [{ermaessigungen: ['KEINE_ERMAESSIGUNG KLASSENLOS'], reisendenTyp: 'ERWACHSENER'}]},
    reservierungsKontingenteVorhanden: false
  };
}
async function dbJourneys(o) {
  const body = navBase(o.dt);
  body.reiseHin = {wunsch: {
    abgangsLocationId: o.from.id, zielLocationId: o.to.id,
    verkehrsmittel: o.dt ? NAV_DT : NAV_ALL, alternativeHalteBerechnung: true,
    zeitWunsch: {reiseDatum: o.time, zeitPunktArt: o.arr ? 'ANKUNFT' : 'ABFAHRT'}
  }};
  if (o.later) body.reiseHin.wunsch.context = o.later;
  const r = await http('POST', `${NAV}/angebote/fahrplan`, body, navHeaders());
  const journeys = (r.verbindungen || []).map(convJourney).filter(Boolean);
  journeys.forEach(j => j.route = {from: o.from, to: o.to});
  return {journeys, laterRef: (r.verbindungReference || {}).later || r.spaeterContext || null};
}
async function dbRefresh(ctx) {
  const r = await http('POST', `${NAV}/trip/recon`, {reconCtx: ctx}, navHeaders());
  const j = convJourney((r.verbindungen && r.verbindungen[0]) || r);
  if (!j) throw new Error('Leere Antwort');
  return j;
}
function secDiff(a, b) { return a && b ? Math.round((new Date(b) - new Date(a)) / 1000) : 0; }
function convJourney(jj) {
  const v = jj && (jj.verbindung || jj);
  const legs = (v && v.verbindungsAbschnitte || []).map(convLeg);
  let token = v && (v.kontext || v.ctxRecon) || null;
  if (token && token.lastIndexOf('$') !== -1) token = token.substring(0, token.lastIndexOf('$') + 1);
  return legs.length ? {legs, refreshToken: token} : null;
}
function stopName(s) { return s && ((s.ort && s.ort.name) || s.name) || ''; }
function convLeg(a) {
  const vm = a.verkehrsmittel || {}, halte = a.halte || [];
  const h0 = halte[0], h1 = halte[halte.length - 1];
  const type = vm.typ || a.typ || '';
  const g = vm.produktGattung || a.produktGattung || '';
  const pDep = a.abfahrtsZeitpunkt || a.abgangsDatum || (h0 && h0.abgangsDatum);
  const eDep = a.ezAbfahrtsZeitpunkt || a.ezAbgangsDatum || (h0 && h0.ezAbgangsDatum);
  const pArr = a.ankunftsZeitpunkt || a.ankunftsDatum || (h1 && h1.ankunftsDatum);
  const eArr = a.ezAnkunftsZeitpunkt || a.ezAnkunftsDatum || (h1 && h1.ezAnkunftsDatum);
  const notes = JSON.stringify([a.echtzeitNotizen, a.risNotizen, a.himNotizen, a.priorisierteMeldungen]);
  return {
    walking: /WALK|FUSSWEG|TRANSFER/.test(type),
    origin: {id: '', name: stopName(h0) || (a.abgangsOrt && a.abgangsOrt.name) || a.abfahrtsOrt || ''},
    destination: {id: '', name: stopName(h1) || (a.ankunftsOrt && a.ankunftsOrt.name) || a.ankunftsOrt || ''},
    plannedDeparture: pDep, departure: eDep || pDep, departureDelay: secDiff(pDep, eDep),
    plannedArrival: pArr, arrival: eArr || pArr, arrivalDelay: secDiff(pArr, eArr),
    plannedDeparturePlatform: h0 && h0.gleis || null, departurePlatform: h0 && (h0.ezGleis || h0.gleis) || null,
    plannedArrivalPlatform: h1 && h1.gleis || null, arrivalPlatform: h1 && (h1.ezGleis || h1.gleis) || null,
    line: {name: vm.name || a.mitteltext || vm.mittelText || a.langtext || '',
      product: g === 'ICE' ? 'nationalExpress' : (g === 'IC_EC' || g === 'EC_IC') ? 'national' : g === 'SBAHN' ? 'suburban' : 'regional'},
    direction: vm.richtung || a.richtung || '', distance: a.distanz || null,
    cancelled: !!(a.cancelled || a.canceled) || /Fahrt fällt aus|Zug fällt aus/i.test(notes)
  };
}

// ---------- Navigation (Hash, damit die Zurück-Taste in der WebView funktioniert) ----------
function go(view) { if (location.hash !== '#' + view) location.hash = view; else render(); }
function render() {
  const view = (location.hash || '#suche').slice(1);
  if ($('sheet')) $('sheet').hidden = true;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.nav === view || (view !== 'gespeichert' && b.dataset.nav === 'suche'))));
  if (view === 'suche') renderRoutes();
  if (view === 'gespeichert') renderSaved();
  if (view === 'detail' && !S.current) go('suche');
  document.querySelectorAll('.view').forEach(v => v.scrollTop = 0);
}
window.addEventListener('hashchange', render);
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));

// ---------- Bahnhofssuche ----------
function setupStation(which) {
  const input = $(which), list = $('sugg-' + which);
  let timer, reqId = 0;
  input.addEventListener('input', () => {
    S[which] = null; updateSearchBtn();
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { list.innerHTML = ''; return; }
    timer = setTimeout(async () => {
      const my = ++reqId;
      try {
        const res = await dbLocations(q);
        if (my !== reqId) return;
        list.innerHTML = res.filter(x => x.id).map(x =>
          `<li><button data-id="${esc(x.id)}" data-name="${esc(x.name)}">${esc(x.name)}</button></li>`).join('');
        list.querySelectorAll('button').forEach(b => b.onclick = () => {
          S[which] = {id: b.dataset.id, name: b.dataset.name};
          input.value = b.dataset.name; list.innerHTML = ''; updateSearchBtn();
          if (which === 'from' && !S.to) $('to').focus();
        });
      } catch (e) {
        list.innerHTML = '<li class="msg">Bahnhöfe konnten nicht geladen werden. Internetverbindung prüfen.<br><small>' + esc(e.message) + '</small></li>';
      }
    }, 300);
  });
}
setupStation('from'); setupStation('to');

function updateSearchBtn() { $('search').disabled = !(S.from && S.to); }

$('swap').onclick = () => {
  [S.from, S.to] = [S.to, S.from];
  $('from').value = S.from ? S.from.name : '';
  $('to').value = S.to ? S.to.name : '';
  updateSearchBtn();
};
function setMode(m) {
  S.mode = m;
  $('m-dep').setAttribute('aria-pressed', String(m === 'dep'));
  $('m-arr').setAttribute('aria-pressed', String(m === 'arr'));
}
$('m-dep').onclick = () => setMode('dep');
$('m-arr').onclick = () => setMode('arr');

// ---------- Zeitauswahl (immer 24 h) ----------
function fillTimePicker() {
  const z = n => String(n).padStart(2, '0');
  const days = ['<option value="now">Jetzt</option>'];
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const label = i === 0 ? 'Heute' : i === 1 ? 'Morgen'
      : d.toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'numeric'});
    days.push(`<option value="${i}">${label}</option>`);
  }
  $('day').innerHTML = days.join('');
  let h = '', m = '';
  for (let i = 0; i < 24; i++) h += `<option value="${i}">${z(i)}</option>`;
  for (let i = 0; i < 60; i++) m += `<option value="${i}">${z(i)}</option>`;
  $('hh').innerHTML = h; $('mi').innerHTML = m;
  resetTime();
}
function resetTime() {
  const now = new Date(Date.now() + 5 * 60000);
  $('day').value = 'now';
  $('hh').value = String(now.getHours());
  $('mi').value = String(Math.floor(now.getMinutes() / 5) * 5);
  syncPick();
}
function chosenTime() {
  const v = $('day').value;
  if (v === 'now') return new Date();
  const d = new Date(); d.setDate(d.getDate() + Number(v));
  d.setHours(Number($('hh').value), Number($('mi').value), 0, 0);
  return d;
}
function syncPick() {
  const d = $('day');
  $('when-l').textContent = d.value === 'now' ? 'Jetzt'
    : `${d.options[d.selectedIndex].text}, ${$('hh').options[$('hh').selectedIndex].text}:${$('mi').options[$('mi').selectedIndex].text}`;
}
function closePick() { $('sheet').hidden = true; }
$('sheet-close').onclick = closePick;

// Ein Screen für Tag, Stunde und Minute (Stunde/Minute als Scroll-Rad)
const WH = 40; // Höhe einer Zeile im Rad
function setupWheel(col, idx, onPick) {
  const items = col.children;
  const mark = () => {
    const i = Math.min(items.length - 1, Math.max(0, Math.round(col.scrollTop / WH)));
    for (let k = 0; k < items.length; k++) items[k].classList.toggle('on', k === i);
    onPick(i);
  };
  col.scrollTop = idx * WH; mark();
  col.addEventListener('scroll', () => { cancelAnimationFrame(col._r); col._r = requestAnimationFrame(mark); });
  [...items].forEach((it, k) => it.onclick = () => col.scrollTo({top: k * WH, behavior: 'smooth'}));
}
function openTime() {
  const z = n => String(n).padStart(2, '0');
  const T = {day: $('day').value === 'now' ? '0' : $('day').value, hh: $('hh').value, mi: $('mi').value};
  const box = $('sheet-opts');
  $('sheet-title').textContent = '';
  box.className = 'opts';
  let hours = '', mins = '';
  for (let i = 0; i < 24; i++) hours += `<div class="wi">${z(i)}</div>`;
  for (let i = 0; i < 60; i++) mins += `<div class="wi">${z(i)}</div>`;
  box.innerHTML = `
    <div class="tp-days" id="tp-days"></div>
    <div class="wheel">
      <div class="wband"></div>
      <div class="wcol" id="w-hh" aria-label="Stunde">${hours}</div>
      <div class="wsep">:</div>
      <div class="wcol" id="w-mi" aria-label="Minute">${mins}</div>
    </div>
    <div class="tp-foot"><button class="go" id="tp-ok">Übernehmen</button></div>`;
  const drawDays = () => {
    $('tp-days').innerHTML = [...$('day').options].map(o =>
      `<button data-day="${o.value}" aria-selected="${o.value === T.day}">${esc(o.text)}</button>`).join('');
    $('tp-days').querySelectorAll('button').forEach(b => b.onclick = () => {
      if (b.dataset.day === 'now') { resetTime(); closePick(); return; }
      T.day = b.dataset.day; drawDays();
    });
  };
  drawDays();
  $('sheet').hidden = false;
  setupWheel($('w-hh'), Number(T.hh), v => T.hh = String(v));
  setupWheel($('w-mi'), Number(T.mi), v => T.mi = String(v));
  const sel = $('tp-days').querySelector('[aria-selected="true"]');
  if (sel) sel.scrollIntoView({inline: 'nearest', block: 'nearest'});
  $('tp-ok').onclick = () => {
    $('day').value = T.day; $('hh').value = T.hh; $('mi').value = T.mi; syncPick(); closePick();
  };
}
$('when-l').onclick = openTime;
fillTimePicker();
function setDt(v) { S.dt = v; $('dt').setAttribute('aria-pressed', String(v)); store('zug2.dt', v); }
setDt(load('zug2.dt', false));
$('dt').onclick = () => setDt(!S.dt);

// ---------- Strecken (Favoriten) ----------
function renderRoutes() {
  $('routes-wrap').style.display = routes.length ? 'block' : 'none';
  $('routes').innerHTML = routes.map((r, i) =>
    `<button data-i="${i}">${esc(r.from.name)} – ${esc(r.to.name)}</button>`).join('');
  $('routes').querySelectorAll('button').forEach(b => b.onclick = () => {
    const r = routes[b.dataset.i];
    S.from = r.from; S.to = r.to;
    $('from').value = r.from.name; $('to').value = r.to.name;
    resetTime(); setMode('dep'); updateSearchBtn();
    search();
  });
}

// ---------- Verbindungssuche ----------
$('search').onclick = () => search();

async function search(more) {
  if (!more) {
    S.journeys = []; S.laterRef = null;
    $('res-head').innerHTML = `<strong>${esc(S.from.name)}</strong> nach <strong>${esc(S.to.name)}</strong>${S.dt ? '<br>Nur Nahverkehr (Deutschlandticket)' : ''}`;
    $('res').innerHTML = '<div class="msg">Suche Verbindungen …</div>';
    go('ergebnisse');
  }
  try {
    const data = await dbJourneys({
      from: S.from, to: S.to, dt: S.dt, arr: !more && S.mode === 'arr',
      time: withOffset(chosenTime()), later: more ? S.laterRef : null
    });
    S.journeys = S.journeys.concat(data.journeys || []);
    S.laterRef = data.laterRef || null;
    renderResults();
  } catch (e) {
    $('res').innerHTML = '<div class="msg">Keine Antwort vom Fahrplan-Server. Internetverbindung prüfen und erneut suchen.<br><small>' + esc(e.message) + '</small></div>';
  }
}

function isRegional(l) {
  const prod = l.line && l.line.product, name = l.line ? l.line.name || '' : '';
  if (prod === 'nationalExpress' || prod === 'national') return false;
  return !/^(ICE|IC|EC|ECE|FLX|RJX?|TGV|NJ|EN)\b/.test(name);
}
function summary(j) {
  const legs = j.legs, a = legs[0], b = legs[legs.length - 1];
  const rides = legs.filter(l => !l.walking);
  return {
    dep: timeHtml(a.plannedDeparture, a.departure, a.departureDelay, a.cancelled),
    arr: timeHtml(b.plannedArrival, b.arrival, b.arrivalDelay, b.cancelled),
    duration: dur(a.departure || a.plannedDeparture, b.arrival || b.plannedArrival),
    changes: Math.max(rides.length - 1, 0),
    lines: rides.map(l => l.line ? l.line.name : '').filter(Boolean).join(', '),
    cancelled: legs.some(l => l.cancelled),
    dt: rides.every(isRegional),
    start: a.plannedDeparture, from: a.origin.name, to: b.destination.name
  };
}

function journeyRow(j, attrs) {
  const s = summary(j);
  const ch = s.changes === 0 ? 'direkt' : s.changes === 1 ? '1 Umstieg' : `${s.changes} Umstiege`;
  return `<button class="row" ${attrs}>
    <div class="times">${s.dep} <span class="arr">– ${s.arr}</span></div>
    <div class="meta">${s.duration}, ${ch}${s.lines ? ', ' + esc(s.lines) : ''}${s.dt ? ', Deutschlandticket' : ''}</div>
    ${s.cancelled ? '<div class="late">Fällt teilweise aus</div>' : ''}
  </button>`;
}

function renderResults() {
  if (!S.journeys.length) { $('res').innerHTML = '<div class="msg">Keine Verbindungen gefunden. Anderen Zeitpunkt probieren.</div>'; return; }
  let lastDay = null, html = '';
  S.journeys.forEach((j, i) => {
    const d = day(j.legs[0].plannedDeparture);
    if (d !== lastDay) { html += `<h2 style="margin-top:14px">${d}</h2>`; lastDay = d; }
    html += journeyRow(j, `data-i="${i}"`);
  });
  if (S.laterRef) html += '<button class="more" id="later">Spätere Verbindungen</button>';
  $('res').innerHTML = html;
  $('res').querySelectorAll('.row').forEach(b => b.onclick = () => openDetail(S.journeys[b.dataset.i], null, 'ergebnisse'));
  if ($('later')) $('later').onclick = () => { $('later').textContent = 'Lädt …'; search(true); };
}

// ---------- Detail ----------
function openDetail(j, savedId, from) {
  S.current = j; S.currentSavedId = savedId; S.detailFrom = from;
  renderDetail(); go('detail');
}
$('detail-back').onclick = () => go(S.detailFrom);

function renderDetail() {
  const j = S.current, s = summary(j);
  let html = `<div class="head"><strong>${esc(s.from)}</strong> nach <strong>${esc(s.to)}</strong><br>${day(s.start)}, ${s.duration}${s.dt ? '<br>Mit Deutschlandticket fahrbar' : ''}</div>`;
  j.legs.forEach(l => {
    if (l.walking) {
      const m = l.departure && l.arrival ? Math.round((new Date(l.arrival) - new Date(l.departure)) / 60000) : null;
      html += `<div class="walk">Fußweg${m ? ' ' + m + ' min' : ''}${l.distance ? ', ' + l.distance + ' m' : ''}</div>`;
      return;
    }
    const pd = l.departurePlatform || l.plannedDeparturePlatform;
    const pa = l.arrivalPlatform || l.plannedArrivalPlatform;
    const pdChanged = l.departurePlatform && l.plannedDeparturePlatform && l.departurePlatform !== l.plannedDeparturePlatform;
    const paChanged = l.arrivalPlatform && l.plannedArrivalPlatform && l.arrivalPlatform !== l.plannedArrivalPlatform;
    html += `<div class="leg">
      <div class="stop"><span class="t">${timeHtml(l.plannedDeparture, l.departure, l.departureDelay, l.cancelled)}</span>
        <span><span class="n">${esc(l.origin.name)}</span>${pd ? `<br><span class="p">Gleis ${esc(pd)}${pdChanged ? ' (geändert)' : ''}</span>` : ''}</span></div>
      <div class="line">${esc(l.line ? l.line.name : '')}${l.direction ? ' Richtung ' + esc(l.direction) : ''}${l.cancelled ? ', fällt aus' : ''}</div>
      <div class="stop"><span class="t">${timeHtml(l.plannedArrival, l.arrival, l.arrivalDelay, l.cancelled)}</span>
        <span><span class="n">${esc(l.destination.name)}</span>${pa ? `<br><span class="p">Gleis ${esc(pa)}${paChanged ? ' (geändert)' : ''}</span>` : ''}</span></div>
    </div>`;
  });
  $('detail').innerHTML = html;

  const a = [];
  if (S.currentSavedId) {
    if (j.refreshToken) a.push('<button id="a-refresh">Verspätungen aktualisieren</button>');
    a.push('<button id="a-del" class="danger">Aus Gespeichert entfernen</button>');
  } else {
    a.push('<button id="a-save">Verbindung speichern</button>');
  }
  const first = j.legs[0], last = j.legs[j.legs.length - 1];
  const rt = j.route || {from: {id: first.origin.id, name: first.origin.name}, to: {id: last.destination.id, name: last.destination.name}};
  const hasRoute = routes.some(r => r.from.id === rt.from.id && r.to.id === rt.to.id);
  if (!hasRoute) a.push('<button id="a-route">Strecke merken</button>');
  $('detail-actions').innerHTML = a.join('');

  if ($('a-save')) $('a-save').onclick = () => {
    const id = Date.now().toString(36);
    saved.unshift({id, journey: j, savedAt: new Date().toISOString()});
    if (store('zug2.saved', saved)) { S.currentSavedId = id; S.detailFrom = 'gespeichert'; renderDetail(); toast('Verbindung gespeichert'); }
    else toast('Speichern nicht möglich');
  };
  if ($('a-del')) $('a-del').onclick = () => {
    saved = saved.filter(x => x.id !== S.currentSavedId); store('zug2.saved', saved);
    toast('Entfernt'); S.current = null; go('gespeichert');
  };
  if ($('a-refresh')) $('a-refresh').onclick = async () => {
    $('a-refresh').textContent = 'Aktualisiert …';
    try {
      const fresh = await dbRefresh(j.refreshToken);
      fresh.route = j.route;
      const entry = saved.find(x => x.id === S.currentSavedId);
      if (entry) { entry.journey = fresh; store('zug2.saved', saved); }
      S.current = fresh; renderDetail(); toast('Aktualisiert');
    } catch (e) { $('a-refresh').textContent = 'Verspätungen aktualisieren'; toast('Kein Netz oder Verbindung abgelaufen'); }
  };
  if ($('a-route')) $('a-route').onclick = () => {
    routes.push(rt);
    store('zug2.routes', routes); renderDetail(); toast('Strecke gemerkt');
  };
}

// ---------- Gespeichert ----------
function renderSaved() {
  let html = '';
  if (!saved.length) html += '<div class="msg">Noch nichts gespeichert. Öffne eine Verbindung und tippe auf „Verbindung speichern“.</div>';
  else {
    html += '<h2>Verbindungen</h2>';
    saved.forEach(x => {
      const s = summary(x.journey);
      html += `<div style="font-size:15px;color:var(--dim);margin-top:12px">${day(s.start)}, ${esc(s.from)} – ${esc(s.to)}</div>`;
      html += journeyRow(x.journey, `data-id="${esc(x.id)}"`);
    });
  }
  if (routes.length) {
    html += '<h2 style="margin-top:30px">Strecken</h2><div class="routes">';
    routes.forEach((r, i) => html += `<button data-ri="${i}">${esc(r.from.name)} – ${esc(r.to.name)} <span style="color:var(--dim);float:right">entfernen</span></button>`);
    html += '</div>';
  }
  $('saved').innerHTML = html;
  $('saved').querySelectorAll('.row').forEach(b => b.onclick = () => {
    const x = saved.find(y => y.id === b.dataset.id); if (x) openDetail(x.journey, x.id, 'gespeichert');
  });
  $('saved').querySelectorAll('[data-ri]').forEach(b => b.onclick = () => {
    routes.splice(+b.dataset.ri, 1); store('zug2.routes', routes); renderSaved(); toast('Strecke entfernt');
  });
}

render();
</script>
</body>
</html>
